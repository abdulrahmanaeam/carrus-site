<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrus — Vehicle maintenance, simplified</title>
  <meta name="description" content="Carrus is the no-nonsense way to track every car you own. Log services, predict what's next, scan receipts. On iPhone.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0B0B0E; color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Segoe UI, system-ui, sans-serif; line-height: 1.55; }
    main { max-width: 720px; margin: 0 auto; padding: 80px 28px 96px; }
    h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 20px; }
    p.lead { font-size: 21px; color: #A3A3A3; max-width: 560px; margin-bottom: 40px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 64px; }
    .link {
      display: inline-flex; align-items: center; padding: 12px 22px;
      border: 1px solid #2A2A2E; border-radius: 999px;
      color: #FAFAFA; text-decoration: none; font-weight: 600; font-size: 15px;
      transition: background 0.15s, border-color 0.15s;
    }
    .link:hover { background: #16161A; border-color: #3A3A3E; }
    .link.primary { background: #146EF5; border-color: #146EF5; }
    .link.primary:hover { background: #1A7AFF; border-color: #1A7AFF; }
    footer { font-size: 13px; color: #6E6E73; padding-top: 32px; border-top: 1px solid #1F1F23; }
    footer a { color: #A3A3A3; text-decoration: none; margin-right: 16px; }
    footer a:hover { color: #FAFAFA; }
  </style>
</head>
<body>
  <main>
    <h1>Carrus</h1>
    <p class="lead">Vehicle maintenance, simplified. Track every car, log every service, and never wonder what's next.</p>

    <div class="links">
      <a class="link primary" href="https://apps.apple.com/app/id6770422802">Download on the App Store</a>
    </div>

    <footer>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="mailto:hello@carrus.app">Contact</a>
    </footer>
  </main>
</body>
</html>
